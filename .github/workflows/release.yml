# À chaque tag v… : fabrique le .deb, le .rpm et l'AppImage, les signe, écrit latest.json
# et publie la release. Pour publier la version de Cargo.toml :
#   git tag -a v0.2.0 -m "Ce qui change" && git push origin v0.2.0
name: Release

on:
  push:
    tags: ["v*"]

# Créer la release et y déposer les paquets.
permissions:
  contents: write

jobs:
  release:
    name: Paquets signés
    # La version la plus ancienne d'Ubuntu encore proposée : les paquets fabriqués sur une
    # glibc ancienne marchent aussi sur les plus récentes, pas l'inverse.
    runs-on: ubuntu-22.04
    # La clé de signature est rangée dans l'environnement « release », réservé aux tags v….
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # latest.json et les adresses des paquets viennent de la version de Cargo.toml : un tag
      # qui ne lui correspond pas publierait des liens cassés.
      - name: Le tag correspond à Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::le tag $GITHUB_REF_NAME ne correspond pas à la version $version de Cargo.toml"
            exit 1
          fi

      - name: Paquets système
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf xdg-utils

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Dépendances de l'interface
        working-directory: desktop
        run: npm ci

      # tauri build fabrique les trois paquets et les signe avec la clé des secrets.
      - name: Paquets signés
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      # Le message du tag sert de notes : dans latest.json, et sur la page de la release.
      - name: latest.json
        working-directory: desktop
        run: |
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > ../notes.txt
          node scripts/latest-json.mjs "$GITHUB_REPOSITORY" "$(cat ../notes.txt)"

      # Un brouillon d'abord, publié une fois tous les fichiers déposés : uehub ne voit
      # jamais une release à moitié remplie.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          bundle=target/release/bundle
          shopt -s nullglob
          files=(
            "$bundle"/deb/*"$version"*.deb*
            "$bundle"/rpm/*"$version"*.rpm*
            "$bundle"/appimage/*"$version"*.AppImage*
            "$bundle"/latest.json
          )
          printf '%s\n' "${files[@]}"
          gh release create "$GITHUB_REF_NAME" --draft --title "uehub $version" \
            --notes-file notes.txt "${files[@]}"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
