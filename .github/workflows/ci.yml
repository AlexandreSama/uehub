# À chaque push sur une branche, et à chaque pull request : le format, clippy, les tests
# Rust, TypeScript et les tests de l'interface. Les tags v… ont leur propre workflow,
# release.yml.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Un nouveau push sur la même branche annule la vérification en cours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Ce workflow ne fait que lire le dépôt.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Vérifications
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Ce que Tauri demande pour compiler sous Linux : WebKitGTK, GTK et leurs amis. CMake
      # et Clang : wreq compile BoringSSL.
      - name: Paquets système
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev cmake clang libclang-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Garde les crates compilées d'un passage à l'autre : quelques minutes de gagnées.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Format Rust
        run: cargo fmt --all --check

      # tsc, puis l'interface compilée dans desktop/dist : le crate Tauri l'embarque, il ne
      # compile pas sans elle.
      - name: TypeScript et interface
        working-directory: desktop
        run: |
          npm ci
          npm run build

      - name: Tests de l'interface
        working-directory: desktop
        run: npm test

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests Rust
        run: cargo test --workspace
