[package]
name = "uehub-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
egs-api.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
directories.workspace = true
log.workspace = true
tokio.workspace = true
futures.workspace = true
reqwest = { workspace = true, features = ["cookies", "json"] }
sha1.workspace = true
keyring-core.workspace = true
zbus-secret-service-keyring-store.workspace = true
zip.workspace = true
fs4.workspace = true
uuid.workspace = true

[dev-dependencies]
# Des dossiers temporaires, effacés à la fin de chaque test
tempfile.workspace = true
# Les morceaux compressés du faux CDN, dans tests/download.rs
flate2.workspace = true
# Le faux serveur HTTP des tests écoute sur 127.0.0.1
tokio = { workspace = true, features = ["net"] }