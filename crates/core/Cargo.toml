[package]
name = "uehub-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The core of uehub: Epic Games sign-in, Fab downloads and Unreal Engine installs"
authors.workspace = true
license-file.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
egs-api.workspace = true
serde.workspace = true
serde_json.workspace = true
directories.workspace = true
log.workspace = true
tokio.workspace = true
futures.workspace = true
reqwest = { workspace = true, features = ["json"] }
# La session unrealengine.com, derrière Cloudflare : voir engines/session.rs
wreq = { workspace = true, features = ["cookies", "json", "gzip", "brotli", "zstd", "deflate"] }
wreq-util.workspace = true
sha1.workspace = true
keyring-core.workspace = true
zbus-secret-service-keyring-store.workspace = true
zip.workspace = true
flate2.workspace = true
deflate64.workspace = true
crc32fast.workspace = true
bytes.workspace = true
rustix.workspace = true
fs4.workspace = true
uuid.workspace = true
# Le masquage des secrets dans le journal
regex.workspace = true

[dev-dependencies]
# Des dossiers temporaires, effacés à la fin de chaque test
tempfile.workspace = true
# Le faux serveur HTTP des tests écoute sur 127.0.0.1
tokio = { workspace = true, features = ["net"] }
