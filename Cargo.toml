[workspace]
resolver = "3"
members = ["crates/*", "desktop/src-tauri"]

# Métadonnées héritées par toutes les crates (`version.workspace = true`, etc.)
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

# Versions centralisées : chaque crate écrit juste `tokio.workspace = true`
[workspace.dependencies]
uehub-core = { path = "crates/core" }

egs-api = "0.14.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "fs", "io-util", "time"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
anyhow = "1.0.104"
directories = "6.0.0"
clap = { version = "4.6.7", features = ["derive"] }
log = "0.4.34"
env_logger = "0.11.11"
futures = "0.3.34"
reqwest = "0.13.5"
sha1 = "0.11.0"
indicatif = "0.18.6"
keyring-core = "1.0.1"
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

tauri = "2.12.4"
tauri-build = "2.7.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "2.8.3"
serde = { version = "1.0.229", features = ["derive"] }

percent-encoding = "2.3.2"
tauri-plugin-notification = "2.7.0"

[profile.release]
lto = "thin"
strip = true
