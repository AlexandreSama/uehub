[workspace]
resolver = "3"
members = ["crates/*"]

# Métadonnées héritées par toutes les crates (`version.workspace = true`, etc.)
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

# Versions centralisées : chaque crate écrit juste `tokio.workspace = true`
[workspace.dependencies]
uehub-core = { path = "crates/core" }

egs-api = "0.14.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
anyhow = "1.0.104"
directories = "6.0.0"
clap = { version = "4.6.7", features = ["derive"] }
log = "0.4.34"
env_logger = "0.11.11"

[profile.release]
lto = "thin"
strip = true
