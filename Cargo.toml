[workspace]
resolver = "3"
members = ["crates/*", "desktop/src-tauri"]

# Métadonnées héritées par toutes les crates (`version.workspace = true`, etc.)
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
authors = ["DjinnSama"]
# Une licence à soi, sans identifiant SPDX : Cargo la désigne par son fichier.
license-file = "LICENSE"
homepage = "https://github.com/TON_COMPTE/uehub"
repository = "https://github.com/TON_COMPTE/uehub"
# uehub ne se publie pas sur crates.io : cargo publish refusera.
publish = false

# Versions centralisées : chaque crate écrit juste `tokio.workspace = true`
[workspace.dependencies]
uehub-core = { path = "crates/core" }

egs-api = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time"] }
serde_json = "1"
anyhow = "1"
directories = "6"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
futures = "0.3"
reqwest = "0.13"
sha1 = "0.11"
indicatif = "0.18"
keyring-core = "1"
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
tauri = "2"
tauri-build = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2.7"
tauri-plugin-updater = "2.14"
serde = { version = "1", features = ["derive"] }
percent-encoding = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64"] }
fs4 = "1"
uuid = { version = "1", features = ["v4"] }
regex = "1"

# Pour les tests seulement
tempfile = "3"
flate2 = "1"

[profile.release]
lto = "thin"
strip = true
