[package]
name = "uehub-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# Le suffixe `_lib` évite un conflit de nom entre la bibliothèque et le binaire.
name = "uehub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
uehub-core.workspace = true
tauri.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-updater.workspace = true
serde.workspace = true
tokio.workspace = true
log.workspace = true
futures.workspace = true
percent-encoding.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Des dossiers temporaires, effacés à la fin de chaque test
tempfile.workspace = true
# Une vraie erreur réseau, pour les phrases du plugin de mise à jour
reqwest.workspace = true
