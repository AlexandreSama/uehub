# cargo about : les licences des crates Rust que uehub embarque, pour THIRD-PARTY-NOTICES.md.
# Régénérer avec : node scripts/third-party-notices.mjs
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    "CC0-1.0",
    "MIT-0",
    "0BSD",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
# Seulement ce qui finit dans les binaires Linux : ni les dépendances de test, ni celles
# des scripts de compilation, ni ce qui ne sert que sous Windows ou macOS.
targets = ["x86_64-unknown-linux-gnu"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
# Les crates de uehub lui-même (publish = false) ne sont pas des tiers.
private = { ignore = true }
